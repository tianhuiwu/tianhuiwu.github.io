      - papers:
          - title: "How the Public Perceives Hidden Corruption: Opinion Leadership and Elite Cues"
            authors:
              - name: Tianhui Wu
                me: true
            abstract: >-
              Citizens frequently judge the extent of corruption among political elites
              despite having little opportunity to observe it directly. Existing research
              shows that public perceptions are closely tied to everyday experiences of petty
              corruption but offers limited explanation for how citizens perceive grand
              corruption occurring at the highest levels of government. This article argues
              that public perceptions of hidden grand corruption are shaped through opinion
              leadership: elites provide informational cues that allow citizens to form
              judgments about grand corruption they cannot directly observe. Using
              Eurobarometer surveys covering 28 European countries from 2005 to 2022, combined
              with expert-based corruption measures, this article distinguishes between grand
              and petty corruption on both the perception and observed dimensions. The
              analyses show that citizens’ perceptions and experiences correspond closely to
              petty corruption but not to grand corruption, whereas elites’ assessments track
              both forms. Error correction models further indicate that public perceptions of
              grand corruption adjust toward elite assessments in both the short run and the
              long run, even after accounting for observed corruption. These findings suggest
              that agreement between elite and public corruption perceptions reflects
              informational dependence rather than shared observation, extending theories of
              opinion leadership to a domain where citizens cannot directly observe the object
              of political judgment.
            links: []

          - title: "Focus on Disaster: Why Attention to Hazards Appears in Party Manifestos"
            authors:
              - name: Tianhui Wu
                me: true
              - name: Elise Pizzi
              - name: Tracy Osborn
            abstract: >-
              Natural disasters impose growing social and economic costs, yet they receive
              little attention in election campaigns. Why do some political parties
              prioritize disaster preparedness and response while others do not? Using 843
              election manifestos from 31 OECD democracies between 2010 and 2025, this study
              shows that only two party families consistently devote attention to disasters:
              green and agrarian parties. They do so for very different reasons. Green parties
              discuss disasters as environmental problems and attention is unrelated to recent
              disaster experience. Agrarian parties instead emphasize disasters when their
              constituencies have recently been affected, focusing on compensation and relief
              for rural communities. These findings show that similar issue attention can
              arise from different motivations: ideological commitments in one case, and
              constituency interests in the other. This work shows that disaster preparedness
              can enter democratic politics through multiple pathways, though it has failed to
              enter most party manifestos despite high profile disasters.
            links: []

          - title: Reducing Post-Disaster Conflict Risk through Migrant Remittances
            authors:
              - name: Elise Pizzi
              - name: Tianhui Wu
                me: true
                corresponding: true
              - name: Sara McLaughlin Mitchell
            abstract: >-
              How do migration and remittance patterns influence the relationship between
              disasters and intrastate conflicts? Existing literature focuses on how disaster
              migration increases social tension and can lead to violent conflict, but it
              rarely examines the role of labor migration and diaspora networks in building
              disaster resilience. We argue that countries whose citizens can rely on migrant
              remittances are less likely to experience conflict because disaster victims and
              affected populations can rely on remittance support from parts of their social
              networks that did not experience the disaster. We expect that higher inflows of
              remittances mitigate the adverse effects of hazards (e.g., displacement), reduce
              post-disaster grievances, increase opportunity costs for rebellion, and lower
              the likelihood of armed conflicts. We test our theory by examining global
              patterns using a cross-sectional time series dataset of disasters and
              international remittances (1970-2021) and find that armed conflict risks after
              disasters are lower in countries that receive more remittances. We find similar
              results leveraging within-country variation with analyses of domestic and
              international remittances and political violence across districts in Peru
              (2004-2022). Our cross-national and Peruvian empirical results show the
              important role of migrant networks in resilience in the face of disasters.
            links: []

